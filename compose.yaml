# Auto-Tune Studio — one service, one image, one container (F1.2-C).
#
# Build and start:
#   docker build --pull=false -t auto-tune:local .
#   docker compose up -d
#   curl http://127.0.0.1:8000/healthz
#
# The normal start requests the NVIDIA GPU: the formal delivery trains on the
# GPU only, so a host without a usable device stops the container with
# DELIVERY_GPU_UNAVAILABLE instead of degrading to a CPU run.
#
# Host directories are created on first start. Override the data root with
# AUTO_TUNE_DATA_DIR (and AUTO_TUNE_DATASETS_DIR for the dataset share) when
# the defaults do not fit. Nothing here contains a credential: the container
# reads the sanitized template from the image on first start only, and refuses
# to start when a persistent directory is not mounted.
#
# API keys typed into the settings page are persisted to the ``secrets`` named
# volume mounted at /data/secrets (AUTO_TUNE_CREDENTIALS_PATH below), so they
# survive a container restart, a recreation and an image update. It is a named
# volume rather than a host bind mount on purpose: a bind mount whose host
# directory does not exist yet is created by Docker owned by root, and the
# unprivileged runtime user would neither be able to write it nor get past the
# start-up preflight. The volume is seeded once from the image directory, which
# the Dockerfile creates owned by the runtime user, so the first start works on
# any host. ``docker compose down`` keeps the volume; only ``down -v`` removes
# it. The file is created on the first save; a start with no key at all is a
# normal start.

services:
  studio:
    image: auto-tune:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auto-tune-studio
    restart: unless-stopped
    # The Engine's default /dev/shm is 64 MiB: the multi-worker training
    # DataLoader dies with a bus error (exit code 1) well below 1 GiB.
    shm_size: 1gb
    ports:
      - "127.0.0.1:${AUTO_TUNE_PORT:-8000}:8000"
    environment:
      AUTO_TUNE_HOST: "0.0.0.0"
      AUTO_TUNE_PORT: "8000"
      AUTO_TUNE_CONFIG_PATH: "/data/config/config.yaml"
      AUTO_TUNE_APP_ROOT: "/opt/auto-tune"
      AUTO_TUNE_DATASETS_DIR: "/data/datasets"
      # Where the credential file backend persists the saved API keys.
      AUTO_TUNE_CREDENTIALS_PATH: "/data/secrets/credentials.json"
      # The directories the folder pickers ("training analysis" / "intelligent
      # analysis") may browse. The configuration inside the container declares no
      # root of its own and the container has no drives, so without this the
      # picker lists nothing at all. Both entries are directories already mounted
      # above — the dataset share the product only reads, and ``detect`` where
      # ``find_detect_dir()`` really writes every training run. The product
      # accepts exactly these two and refuses every other container directory
      # (including ``/data/secrets``, ``/opt/auto-tune/log``, the weight store
      # and the retired ``runs`` mount), so the picker cannot walk into the
      # container's own filesystem. No host directory is added to the mounts.
      AUTO_TUNE_INPUT_ALLOWED_ROOTS: "/data/datasets;/opt/auto-tune/detect"
    volumes:
      - "${AUTO_TUNE_DATA_DIR:-./docker-data}/config:/data/config"
      - "${AUTO_TUNE_DATA_DIR:-./docker-data}/log:/opt/auto-tune/log"
      - "${AUTO_TUNE_DATA_DIR:-./docker-data}/detect:/opt/auto-tune/detect"
      - "${AUTO_TUNE_DATA_DIR:-./docker-data}/runs:/opt/auto-tune/runs"
      - "${AUTO_TUNE_DATA_DIR:-./docker-data}/models/weights:/opt/auto-tune/models/weights"
      - "${AUTO_TUNE_DATASETS_DIR:-./docker-data/datasets}:/data/datasets"
      - "secrets:/data/secrets"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  # Operator credentials, created and owned by the runtime user inside the
  # image. Kept by `docker compose down`, removed only by `down -v`.
  secrets:

project:
  # 公开模板只含通用占位示例：本文件会随仓库发布，切勿填入客户、产线、
  # 数据集或项目专用信息；真实项目信息请填本地 config.yaml（不入库）。
  name: 示例项目名称
  description: 示例项目描述
  detection_target: 示例检测目标，如"表面缺陷（划痕、破损、脏污）"
  data_type: 示例数据类型，如"工业相机拍摄的 RGB 图像"
  extra: {}
  data_yaml: ''
  model: yolov8n.pt
# API Key 不写入本文件。请通过 Studio UI 的“AI 服务配置”填写，
# 或在环境中设置只读高优先级变量 AUTO_TUNE_TEXT_API_KEY / AUTO_TUNE_VISION_API_KEY。
# 切勿把密钥写入此文件、命令行参数或脚本历史。
llm:
  provider: deepseek
  credential_ref: AutoTuneStudio/text/deepseek
  model: deepseek-flash
  endpoint: https://api.deepseek.com/v1/chat/completions
  temperature: 0.3
  max_tokens: 2000
  enabled: true
  allow_private_endpoint: false
vision:
  provider: qwen
  credential_ref: AutoTuneStudio/vision/qwen
  model: qwen-vl-plus
  endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
  temperature: 0.3
  max_tokens: 500
  enabled: true
  error_crops_enabled: true
  allow_private_endpoint: false
guardrails:
  mode: strict
  custom_rules_dir: guardrails/rules/
probe:
  enabled: true
  probe_epochs: 10
  auto_continue_threshold_mAP50: 0.05
  max_retries: 3
# 目录输入安全（Studio S1.4）：正式目录入口在递归处理前执行统一预检。
# max_directory_bytes 单位为字节（默认 500 GiB）。
# allowed_roots 为空表示允许本机任意绝对路径；非空时输入必须位于某个规范化根内。
# allow_unc_paths 默认关闭，本批不把 UNC/网络共享作为正式范围。
input_safety:
  max_directory_members: 200000
  max_directory_bytes: 536870912000
  allowed_roots: []
  allow_unc_paths: false
# 本地稳定索引（Studio S2 Core）：SQLite 只是可重建查询投影，不替代 JSON
# 审计事实文件，也不复制数据集、权重或训练产物。database_path 与 backup_dir
# 不能相同；backup_max_files 必须在 1-10，busy_timeout_ms 必须在 100-60000。
local_index:
  database_path: log/auto_tune.db
  backup_dir: log/db_backups
  backup_max_files: 3
  busy_timeout_ms: 5000
# 受控权重库（F1.1-A）：直接训练与 HPO 的初始权重只能从这里选择。
# root 是项目根下的受控目录（不入库）；max_upload_bytes 是单文件上传上限。
# 本批不访问网络、不自动下载 Ultralytics 权重，也不扫描 detect/trainN 训练产物。
model_store:
  root: models/weights
  max_upload_bytes: 2147483648
  max_models: 100
dataset_analyzer:
  blur_threshold: 30
  under_exposure_pixel_threshold: 30
  over_exposure_pixel_threshold: 220
  under_exposure_ratio_threshold: 0.5
  over_exposure_ratio_threshold: 0.3
  snr_threshold: 1.5
  quality_sample_size: 500
  cluster_sample_size: 200
  bbox_tiny_threshold: 0.005
  bbox_small_threshold: 0.02
  bbox_medium_threshold: 0.1
  spatial_center_low: 0.25
  spatial_center_high: 0.75
  spatial_edge_low: 0.1
  spatial_edge_high: 0.9
  high_iou_threshold: 0.7
  long_tail_ratio: 0.3
  dbscan_eps: 0.3
  dbscan_min_samples: 5
  warn_label_rate: 0.3
  warn_tiny_bbox_ratio: 0.3
  warn_center_concentration: 0.6
  warn_blur_ratio: 0.3
  quality_blur_weight: 0.15
  quality_under_weight: 0.15
  quality_over_weight: 0.15
  quality_imbalance_weight: 0.25
train_analyzer:
  plateau_epochs: 10
  overfit_threshold: 0.15
  val_loss_ma_window: 5
  min_acceptable_map: 0.5
  stale_threshold: 15
  top_k_runs: 5
  compare_metric: metrics/mAP50(B)
training:
  default_epochs: 100
  patience: 20
  imgsz: 640
  batch: 16
  workers: 4
  data_yaml: ''
  model: yolov8n.pt
